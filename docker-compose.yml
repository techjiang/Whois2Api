# Minimal deployment. Everything persistent lives in the named volume.
services:
  whois2api:
    build: .
    image: whois2api:latest
    container_name: whois2api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Leave empty to run without auth on a private network.
      W2A_TOKENS: ""
      W2A_RATE_LIMIT: "300"
      W2A_CACHE_TTL: "30m"
      W2A_NEGATIVE_TTL: "5m"
      W2A_LOG_LEVEL: "info"
    volumes:
      - whois2api-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image is read-only; /tmp is the only writable scratch space needed.
    tmpfs:
      - /tmp

volumes:
  whois2api-data:
