# CNB pipeline.
#
# Shape follows the official grammar: branch events live under the branch name,
# repository-level events (tag_push) live under the "$" fallback branch. Each
# stage's work is expressed as jobs; a single job may omit the stage "name".
#
# golang:1.23 (Debian) rather than the alpine tag, because the race detector
# needs a C toolchain.

main:
  # Pull requests get the same checks as the branch they target. Without this,
  # a PR sat on a green status that came from a pipeline nobody ran: `-race` had
  # never executed on this project until someone added gcc by hand.
  #
  # Note the config is read from the *target* branch, so this only starts
  # covering PRs after it lands on main.
  pull_request:
    - stages:
        - name: lint
          image: golang:1.23
          script:
            - test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }
            - go vet ./...

        - name: test
          image: golang:1.23
          script:
            - go test -race ./...

        - name: build and smoke
          image: golang:1.23
          script:
            - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/whois2api ./cmd/whois2api
            - ./bin/whois2api version
            - bash scripts/smoke.sh

  push:
    - stages:
        - name: lint
          image: golang:1.23
          script:
            - test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }
            - go vet ./...

        - name: test
          image: golang:1.23
          script:
            - go test -race ./...

        # Build and smoke in one job: each job runs in its own container, so a
        # binary built in an earlier job is not on disk here.
        - name: build and smoke
          image: golang:1.23
          script:
            - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/whois2api ./cmd/whois2api
            - ./bin/whois2api version
            - bash scripts/smoke.sh

# Tag pushes publish a container image. Kept under "$" because tag events are
# repository-level and otherwise unrelated to any branch.
$:
  tag_push:
    - services:
        - docker
      stages:
        - name: build and smoke
          image: golang:1.23
          script:
            - go test ./...
            - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/whois2api ./cmd/whois2api
            - bash scripts/smoke.sh

        - name: docker build
          image: golang:1.23
          script:
            - echo "$CNB_TOKEN" | docker login "$CNB_DOCKER_REGISTRY" -u cnb --password-stdin
            - docker build -t "$CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE:$CNB_TAG_NAME" .
            - docker push "$CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE:$CNB_TAG_NAME"
